name: Build & Release (macOS + Windows)

on:
  push:
    branches:
      - release
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--bundles dmg,app"
          - platform: windows-latest
            args: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Configure Windows build tools (LLVM / CMake)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake -y
          }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/tauri.conf.json').version")
          NOTES=$(awk -v ver="## v${VERSION}" '
            index($0, ver) == 1 { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Bản phát hành A-Sir v${VERSION} cho macOS (\`.dmg\`) và Windows (\`.exe\` / \`.msi\`)."
          fi
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo ""
            echo "### Lưu ý khi mở ứng dụng lần đầu (chưa ký chứng chỉ Apple / Windows)"
            echo "- **macOS:** Sau khi kéo \`A-Sir.app\` vào thư mục **Applications**, nếu macOS báo *\"is damaged and can't be opened\"*, mở **Terminal** và chạy:"
            echo '  ```bash'
            echo "  xattr -cr /Applications/A-Sir.app"
            echo '  ```'
            echo "  Sau đó mở \`A-Sir\` bình thường."
            echo "- **Windows:** Nếu Windows SmartScreen hiện cảnh báo, chọn **More info** → **Run anyway**."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: "A-Sir v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
