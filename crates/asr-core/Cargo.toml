[package]
name = "asr-core"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rubato = "0.16"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav", "adpcm"] }
thiserror = "2"
unicode-normalization = "0.1"
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
hound = "3.5"
strsim = "0.11"
